{@io.quarkiverse.roq.frontmatter.runtime.model.Site site}
<header class="site-header">
  <div class="container bar">
    <a class="brand" href="{=site.url}">
      <img class="logo-light" src="{=site.url('images/logo.png')}" alt="Envy Hair &amp; Barber" width="600" height="595">
      <img class="logo-dark" src="{=site.url('images/logo-dark.png')}" alt="" aria-hidden="true" width="600" height="595">
      <span class="brand-name">Envy <span>Hair &amp; Barber</span></span>
    </a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle-input" aria-label="Toggle menu">
    <label for="nav-toggle" class="nav-toggle"><span></span></label>
    <nav class="site-nav" aria-label="Main navigation">
      <ul>
        <li><a href="{=site.url}">Home</a></li>
        <li><a href="{=site.url('services')}">Services</a></li>
        <li><a href="{=site.url('contact')}">Contact</a></li>
        <li><a class="btn-book" href="tel:+61397876009">Call (03) 9787 6009</a></li>
      </ul>
    </nav>
  </div>
</header>
